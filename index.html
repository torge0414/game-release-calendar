<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏发售日历</title>
<script>/* 主题预载(防闪烁): 存过偏好用偏好, 否则跟随系统 */
try{var _t=localStorage.getItem('glwTheme');
if((_t==='dark')||(!_t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
}catch(e){}</script>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --txt:#1d1d1f; --sub:#6e6e73; --dim:#86868b;
    --line:rgba(0,0,0,.05);
    --acc:#0071e3; --acc-bg:#e8f1fd;
    --today:#ff9f0a;
    --st:#0071e3; --st-bg:#e8f1fd;
    --ps:#5e5ce6; --ps-bg:#ecebfb;
    --ns:#ff375f; --ns-bg:#feeaef;
    --pic-bg:#e9e9ee; --spin:#d2d2d7; --switch-bg:#e3e3e8;
    --shadow:0 2px 6px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.07);
    --shadow-hi:0 4px 10px rgba(0,0,0,.06), 0 18px 44px rgba(0,0,0,.11);
    --r:18px;
  }
  html.dark{
    --bg:#101013; --card:#1c1c21; --txt:#f5f5f7; --sub:#9b9ba1; --dim:#6f6f77;
    --line:rgba(255,255,255,.09);
    --acc:#3fa2ff; --acc-bg:#0d2b4a;
    --st:#54aaff; --st-bg:#0d2b4a;
    --ps:#a5a1ff; --ps-bg:#2a2852;
    --ns:#ff6b86; --ns-bg:#4a1d2c;
    --pic-bg:#232329; --spin:#4a4a52; --switch-bg:#3a3a3e;
    --shadow:0 2px 6px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.32);
    --shadow-hi:0 5px 12px rgba(0,0,0,.55), 0 22px 52px rgba(0,0,0,.45);
  }
  html.dark .err{background:#361d1a; border-color:#6b322c; color:#ffb4a6;}
  /* 封面画框在夜间保持浅色, 超宽横幅(完整显示)的留白处能把深色封面衬出来 */
  html.dark .pic{background:#c9c9cf;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); min-width:320px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding:26px 20px 44px; overflow-x:hidden;
  }
  .wrap{max-width:860px; margin:0 auto; position:relative;}
  .theme-btn{
    position:relative; display:block; margin:0 0 18px auto; width:54px; height:31px; border-radius:999px;
    border:0; cursor:pointer; background:var(--switch-bg); padding:0;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1px 2px rgba(0,0,0,.06);
    transition:background .6s, transform .6s cubic-bezier(.4,0,.2,1), box-shadow .6s; z-index:5;
  }
  .theme-btn:hover{transform:scale(1.06); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),
       inset 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.14);}
  .theme-btn:active{transform:scale(.96);}
  .theme-btn .tb-sun,.theme-btn .tb-moon{position:absolute; top:50%; transform:translateY(-50%);
       font-size:12px; line-height:1; color:var(--dim); pointer-events:none; transition:color .6s;}
  .theme-btn .tb-sun{left:9px;}
  .theme-btn .tb-moon{right:8px;}
  html.dark .theme-btn .tb-sun{color:#d8a13a;}
  html.dark .theme-btn .tb-moon{color:#9aa0a6;}
  .theme-btn .tb-knob{
    position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25);
    transition:left .6s cubic-bezier(.4,0,.2,1);
  }
  html.dark .theme-btn .tb-knob{left:25px;}
  header{text-align:center; padding:10px 0 4px;}
  .eyebrow{font-size:12px; font-weight:600; color:var(--acc); letter-spacing:.12em;
       text-transform:uppercase; margin-bottom:8px;}
  h1{font-size:clamp(23px,6.8vw,40px); font-weight:700; letter-spacing:.02em; line-height:1.1; white-space:nowrap;}
  .sub{font-size:15px; color:var(--sub); margin-top:10px;}
  .meta{font-size:11.5px; color:var(--dim); margin-top:0; padding-top:10px; display:flex; align-items:center;
       justify-content:center; gap:7px;}
  .meta .msep{opacity:.5;}
  .sect{margin-top:16px;}
  /* 页切换: 两列表叠放交叉过渡(重叠淡入淡出); 容器高度瞬时调整, 不做高度动画(否则下方内容会慢慢滑=下沉感) */
  .pages{position:relative;}
  .page{position:absolute; top:0; left:0; width:100%; opacity:0; pointer-events:none;
        transform:translateX(0); margin-top:0;
        transition:opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);}
  .page.on{position:relative; opacity:1; pointer-events:auto; transform:translateX(0);}  /* 活动页留在文档流, 避免加载瞬间容器塌陷(底部元素上跳) */
  .page.pre-r{opacity:0; transform:translateX(44px);}
  .page.pre-l{opacity:0; transform:translateX(-44px);}
  /* 进出场都用 keyframes: 显式定义起点, 不依赖元素残留状态(transition 会被起点问题吞掉) */
  @keyframes inR{from{opacity:0; transform:translateX(44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes inL{from{opacity:0; transform:translateX(-44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes outL{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(-44px);}}
  @keyframes outR{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(44px);}}
  .page.anim-in-r{animation:inR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-in-l{animation:inL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-l{animation:outL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-r{animation:outR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  /* 内容区初始就占满视口: 加载期间底部署名不在首屏内, 避免刷新时的跳动/闪烁 */
  #viewStack{min-height:calc(100vh - 100px);}
  .h2c{font-size:12.5px; color:var(--dim); font-weight:500; text-align:center; margin:0 0 12px; padding-top:16px;}
  .sect h2{
    font-size:17px; font-weight:700; color:var(--txt); letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:10px; margin:0 6px 14px;
  }
  .sect h2 .n{color:var(--acc); font-size:24px;}
  .sect h2 .count{font-size:12.5px; font-weight:500; color:var(--dim); margin-left:auto;}
  /* 单列横卡: 封面左 信息右(封面用原始比例, 清晰度最佳) */
  .list{display:flex; flex-direction:column; gap:10px;}
  .item{
    display:flex; align-items:center; gap:16px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r); padding:14px 18px 14px 14px;
    box-shadow:var(--shadow); transition:transform .6s cubic-bezier(.4,0,.2,1), box-shadow .6s;
    position:relative; min-width:0;
  }
  .item:hover{transform:translateY(-2px); box-shadow:var(--shadow-hi);}
  .item.today{border-color:rgba(255,159,10,.45);}
  .item.today::before{
    content:""; position:absolute; left:-1px; top:18px; bottom:18px; width:3px;
    border-radius:0 3px 3px 0; background:var(--today);
  }
  .pic{flex:0 0 132px; width:132px; height:66px; border-radius:12px; overflow:hidden;
       position:relative; background:var(--pic-bg); flex:none;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
  .pic .cover{width:100%; height:100%; object-fit:cover; display:block;}
  .pic .cover.wide{object-fit:contain;}  /* 超宽横幅完整显示(不裁切) */
  .pic .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
       font-size:22px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .txt{min-width:0; flex:1; padding:0;}
  .txt .tline{display:flex; align-items:center; gap:8px; min-width:0;}
  .txt .tline .t{font-size:15.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .txt .when{flex:none; margin-left:auto; font-size:10.5px; font-weight:700; border-radius:7px; padding:2px 8px;
       line-height:1.4; letter-spacing:.01em; white-space:nowrap;}
  .when.soon{background:var(--acc-bg); color:var(--acc);}
  .when.today{background:#fff0dd; color:#b26a00;}
  html.dark .when.today{background:#4a320f; color:#ffc46b;}
  .when.out{background:rgba(52,199,89,.14); color:#1f9d55;}
  html.dark .when.out{background:rgba(48,209,88,.18); color:#4cd964;}
  .txt .tag{font-size:12px; color:var(--dim); margin-top:5px; display:flex; align-items:center; gap:7px;
       flex-wrap:wrap;}
  .txt .tag b{color:var(--today); font-weight:700;}
  .txt .tag .mc{display:none;}
  .txt .tag.tag3{margin-top:2px; padding-right:56px;}   /* 给右下角评分块让位 */
  .mcbox{position:absolute; right:18px; bottom:14px; border-radius:13px; padding:8px 4px 11px;
       min-width:50px; color:#fff; display:flex; align-items:center; justify-content:center;
       line-height:1; z-index:2; box-shadow:0 2px 8px rgba(0,0,0,.18); text-decoration:none;}
  .mcbox:hover{filter:brightness(1.08);}
  .mcbox .mcv{font-size:24px; font-weight:800; letter-spacing:-.01em; line-height:1; text-decoration:none;}
  .mcbox.g,.mcbox.y,.mcbox.r{text-align:center;}
  .mcbox.g{background:#1f9d55;} .mcbox.y{background:#e2a03a;} .mcbox.r{background:#d6453f;}
  html.dark .mcbox{box-shadow:0 2px 10px rgba(0,0,0,.45);}
  .plats{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:600; text-decoration:none; border-radius:980px;
    padding:3px 11px; display:inline-flex; align-items:center; gap:5px;
    transition:.6s; letter-spacing:.01em; white-space:nowrap;
  }
  .chip:hover{transform:scale(1.05);}
  .chip .pd{font-weight:500; opacity:.65; font-size:10.5px;}
  .chip.st{color:var(--st); background:var(--st-bg);}
  .chip.ps{color:var(--ps); background:var(--ps-bg);}
  .chip.ns{color:var(--ns); background:var(--ns-bg);}
  .empty{color:var(--dim); font-size:14px; padding:18px 8px; text-align:center;}
  .loading{color:var(--dim); font-size:14px; text-align:center; padding:52px 0;}
  .loading .spin{display:inline-block; width:22px; height:22px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* 启动遮罩: 数据就位前盖住整页, 所有布局变化都发生在遮罩下(刷新时看不到元素移动) */
  #boot{position:fixed; inset:0; background:var(--bg); z-index:99; display:flex;
       align-items:center; justify-content:center; transition:opacity .35s ease;}
  #boot.hide{opacity:0; pointer-events:none;}
  #boot .spin{display:inline-block; width:26px; height:26px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  .err{background:#fff2f0; border:1px solid #ffd7d2; color:#c0422a; padding:11px 16px;
       border-radius:12px; font-size:13px; margin-top:14px; display:none; text-align:center;}
  .tabs{display:flex; width:max-content; margin:20px auto 2px; background:var(--switch-bg);
       border-radius:999px; padding:3px; gap:2px; position:relative;
       box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1px 2px rgba(0,0,0,.05);}
  .tabg{position:absolute; top:3px; left:3px; bottom:3px; background:#fff; border-radius:999px;
       box-shadow:0 1px 4px rgba(0,0,0,.14); z-index:0;
       transition:transform .6s cubic-bezier(.4,0,.2,1), width .6s cubic-bezier(.4,0,.2,1);}
  html.dark .tabg{background:#2c2c31;}
  .tab{
    position:relative; z-index:1; border:0; background:transparent; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:600; color:var(--dim); padding:7px 22px;
    border-radius:999px; transition:color .6s;
  }
  .tab:hover{color:var(--txt);}
  .tab.on{color:var(--txt);}
  .tabs.top{margin:12px auto 2px;}
  .pic.m{flex:0 0 68px; width:68px; height:100px;}
  .pic.m .ph{font-size:20px;}
  footer{color:var(--dim); font-size:11.5px; margin-top:40px; text-align:center; padding-bottom:8px;}
  .credit{color:var(--dim); font-size:11px; text-align:center; padding-bottom:16px; opacity:.8;}
  @media (max-width:640px){
    h1{font-size:32px;}
    .pic{flex-basis:116px; width:116px; height:58px;}
    /* 窄屏: 平台标签让出右下角评分块区域, 放不下自动换行(宽屏不受影响) */
    .plats{padding-right:62px;}
  }
</style>
</head>
<body>
<div id="boot"><span class="spin"></span></div>
<div class="wrap">
  <button class="theme-btn" id="themeBtn" title="切换外观" aria-label="切换浅色/夜间模式">
    <span class="tb-sun">☀</span><span class="tb-moon">☾</span><span class="tb-knob"></span>
  </button>
  <header>
    <h1>RELEASE CALENDAR</h1>
    <div class="tabs top" id="topTabs">
      <span class="tabg"></span>
      <button class="tab on" data-view="game">游戏</button>
      <button class="tab" data-view="movie">电影</button>
    </div>
  </header>
  <div class="pages" id="viewStack">
  <div class="page on" id="viewGame">
    <div class="meta"><span id="metaTxt"></span><span class="msep">·</span><span>每月初自动更新</span></div>
    <div class="err" id="errBox"></div>
    <div class="tabs" id="tabs"></div>
    <div id="body"><div class="loading"><span class="spin"></span></div></div>
    <footer id="foot"></footer>
  </div>
  <div class="page" id="viewMovie">
    <div class="meta"><span id="mmeta"></span><span class="msep">·</span><span>每月初自动更新</span></div>
    <div class="err" id="mErrBox"></div>
    <div class="tabs" id="mtabs"></div>
    <div id="movieBody"><div class="loading"><span class="spin"></span></div></div>
    <footer id="mfoot"></footer>
  </div>
  </div>
  <div class="credit">@torge</div>
</div>

<script>
const $ = s => document.querySelector(s);

/* 夜间模式切换(iOS 开关样式, 状态由 CSS html.dark 驱动) */
(function(){
  const btn = document.getElementById('themeBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const dark = document.documentElement.classList.toggle('dark');
    try{ localStorage.setItem('glwTheme', dark ? 'dark' : 'light'); }catch(e){}
  });
})();
const PALS = [['#0071e3','#0a58a5'],['#af52de','#6d2fa8'],['#ff375f','#b0183a'],
  ['#34c759','#1e7a3e'],['#ff9f0a','#b26a00'],['#5e5ce6','#3634a8'],
  ['#ff6482','#a81d3a'],['#30b0c7','#1a6a78']];
const today = new Date();
function phColor(t){ let h=0; for(const c of t) h=(h*31+c.codePointAt(0))>>>0;
  const [a,b]=PALS[h%PALS.length]; return 'linear-gradient(135deg,'+a+','+b+')'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function refresh(){
  $('#errBox').style.display='none';
  try{
    const r = await fetch('releases.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
  }catch(e){
    $('#errBox').textContent='获取失败：'+e.message;
    $('#errBox').style.display='block';
    showCredit();
    hideBoot();
  }
}

function moveGlider(tabsEl, btn){
  const g = tabsEl.querySelector('.tabg');
  if(!g || !btn) return;
  g.style.width = btn.offsetWidth + 'px';
  g.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
}

/* 通用: 本月/下月页签 + 交叉重叠过渡(游戏/电影共用); makeCard 造卡片, unit 计数单位 */
function tabbed(tabsEl, bodyEl, groups, makeCard, unit){
  bodyEl.innerHTML='';
  tabsEl.innerHTML = '<span class="tabg"></span>';  // 滑块层
  const sections = [];
  const pagesEl = document.createElement('div'); pagesEl.className='pages';
  let curIdx = 0;

  const fit = ()=>{
    /* 取所有页的最大高度: 切换时容器高度不变, 页面高度恒定(否则下方内容会随切换跳动=下沉感) */
    let mx = 0;
    sections.forEach(s=>{ if(s.offsetHeight > mx) mx = s.offsetHeight; });
    if(mx) pagesEl.style.height = mx + 'px';
  };
  const switchTo = (i)=>{
    if(i===curIdx || !sections[i]) return;
    const forward = i > curIdx;
    const cur = sections[curIdx], nxt = sections[i];
    // 旧页先脱离文档流(去 on → absolute)再让新页进场; 两页都走 keyframes 动画, 每次强制重播
    animSwap(cur, nxt, forward);
    curIdx = i;
    fit();
    if(typeof stackFit === 'function') stackFit();   // 列表高度变化后同步外层容器(否则首次切换内容会溢出/错位)
    tabsEl.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on', j===i));
    moveGlider(tabsEl, tabsEl.querySelectorAll('.tab')[i]);
  };

  groups.forEach((g,i)=>{
    const items = g.games || g.movies || [];
    const sect = document.createElement('div');
    sect.className = 'sect page' + (i===0 ? ' on' : '');
    const h2 = document.createElement('div'); h2.className='h2c';
    h2.textContent = items.length + ' ' + unit;
    sect.appendChild(h2);
    const list = document.createElement('div'); list.className='list';
    if(!items.length) list.innerHTML='<div class="empty">该月暂无已定档</div>';
    else items.forEach(it=>list.appendChild(makeCard(it)));
    sect.appendChild(list); pagesEl.appendChild(sect);
    sections.push(sect);
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===0 ? ' on' : '');
    btn.textContent = (i===0 ? '本月' : '下月') + ' · ' + g.month + '月';
    btn.addEventListener('click', ()=>switchTo(i));
    tabsEl.appendChild(btn);
  });
  bodyEl.appendChild(pagesEl);
  fit();  // 首屏高度
  const key = '_fit_' + (tabsEl.id || 'x');
  if(window[key]) window.removeEventListener('resize', window[key]);
  window[key] = fit;
  window.addEventListener('resize', fit);
  moveGlider(tabsEl, tabsEl.querySelector('.tab'));
  return fit;
}

function showCredit(){
  const c = document.querySelector('.credit');
  if(c) c.classList.add('show');
}

/* 数据就位后淡出启动遮罩 */
function hideBoot(){
  const b = document.getElementById('boot');
  if(b) setTimeout(()=>b.classList.add('hide'), 60);
}

function stackFit(){
  const stack = document.getElementById('viewStack');
  if(!stack) return;
  /* 只认直接子视图, 不能用 querySelector('.page.on')——会误命中嵌套的子页签页(viewGame/viewMovie 内部) */
  const on = Array.from(stack.children).find(el=>el.classList.contains('on'));
  if(!on) return;
  stack.style.height = on.offsetHeight + 'px';   // 瞬时, 不做高度动画
}

const PAGE_CLASSES = ['on','pre-r','pre-l','out-l','out-r','anim-in-r','anim-in-l','anim-out-l','anim-out-r'];

/* 交叉重叠过渡: 旧页出场 + 新页进场(都用 keyframes, 每次强制重播) */
function animSwap(cur, nxt, forward){
  cur.classList.remove(...PAGE_CLASSES);
  void cur.offsetWidth;                                  // 强制回流, 保证动画重播
  cur.classList.add(forward ? 'anim-out-l' : 'anim-out-r');
  nxt.classList.remove(...PAGE_CLASSES);
  void nxt.offsetWidth;
  nxt.classList.add(forward ? 'anim-in-r' : 'anim-in-l');
  nxt.classList.add('on');
}

function render(d){
  $('#metaTxt').textContent = '数据更新于 ' + (d.updated||'') ;
  const groups = d.groups||[];
  tabbed($('#tabs'), $('#body'), groups, card, '款');
  const total = groups.reduce((s,g)=>s+(g.games||[]).length,0);
  $('#foot').textContent = '共 '+total+' 款 · 人民币为 Steam 国区价 · 港币为 PS / NS 港服价';
  showCredit();
  stackFit();
  hideBoot();
}

function card(it){
  const wrap = document.createElement('div'); wrap.className='item';
  const isToday = it.day===today.getDate() && it.month===today.getMonth()+1 && it.year===today.getFullYear();
  if(isToday) wrap.classList.add('today');
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt, whenCls;
  if(diff===0){ whenTxt='今天发售'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天发售'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有 '+diff+' 天'; whenCls='soon'; }
  else { whenTxt='已发售'; whenCls='out'; }
  const whenTag = whenCls ? '<span class="when '+whenCls+'">'+whenTxt+'</span>' : '';
  const pl = it.plats||[];
  /* 封面优先横版图源; 候选链全部列出, 加载失败自动换下一张 */
  const cand = [];
  ['steam','ns','ps'].forEach(k=>{ const p=pl.find(x=>x.key===k); if(p&&p.img) cand.push(p.img); });
  const imgUrl = cand[0] || '';
  const candJson = JSON.stringify(cand).replace(/'/g, "&#39;");
  const imgTag = imgUrl
    ? '<img class="cover" src="'+esc(imgUrl)+'" alt="" loading="lazy" data-cand="'+candJson+'" onerror="cf(this)" onload="ckw(this)">'
    : '';
  const chips = pl.map(p=>{
    const pv = p.price;
    let pfmt = '';
    if (pv!=null && pv!==false && pv!=='') {
      const n = Number(pv);
      pfmt = (n % 1 === 0) ? String(n) : n.toFixed(2);
      pfmt = (p.key==='steam' ? '¥'+pfmt : 'HK'+pfmt);
    }
    const url = p.url ? 'href="'+esc(p.url)+'" target="_blank"' : '';
    const pm = (p.key==='steam'?'st':p.key);
    return '<a class="chip '+pm+'" '+url+'>'+p.name+
      (pfmt?' · '+pfmt:'')+'</a>';
  }).join('');
  const mc = (typeof it.mc==='number' && it.mc>0) ? it.mc : null;
  const mcBox = mc ? '<a class="mcbox '+(mc>=80?'g':(mc>=60?'y':'r'))+'" href="'+esc(it.mc_url||'https://www.metacritic.com/')+'" target="_blank" rel="noopener" title="Metacritic 均分 '+(mc>=80?'好评':(mc>=60?'中评':'差评'))+'">'+
      '<span class="mcv">'+mc+'</span></a>' : '';
  wrap.innerHTML =
    '<div class="pic">'+imgTag+
      '<div class="ph" style="background:'+phColor(it.title)+(imgUrl?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div>'+whenTag+'</div>'+
      '<div class="tag"><span>'+it.month+'月'+it.day+'日'+(it.dev?' · '+esc(it.dev):'')+'</span></div>'+
      (chips?'<div class="plats">'+chips+'</div>':'')+
    '</div>'+mcBox;
  wrap.querySelector('.t').textContent = it.title;
  return wrap;
}

function firstChar(t){ t=(t||'').trim(); return t?Array.from(t)[0]:'?'; }

/* 封面多级兜底: 当前图加载失败 -> 依次试候选链中下一张 -> 全失败显示首字占位 */
function cf(img){
  const cand = JSON.parse(img.dataset.cand || '[]');
  const idx = cand.indexOf(img.src);
  const next = cand[idx + 1];
  if(next){ img.src = next; return; }
  img.style.display='none';
  const ph = img.parentNode && img.parentNode.querySelector('.ph');
  if(ph) ph.style.display='flex';
}

/* 超宽图(比例>2.35)切 contain 完整显示, 避免横幅被裁 */
function ckw(img){
  try{
    if(img.naturalWidth && img.naturalHeight && img.naturalWidth/img.naturalHeight > 2.35){
      img.classList.add('wide');
    }
  }catch(e){}
}

/* ---------- 电影(豆瓣) ---------- */
function minfoParts(s){
  const p = String(s||'').split('/').map(x=>x.trim()).filter(Boolean);
  return { region: p[1] || '', kind: p[2] || '', director: p[3] || '' };   // 副标题: 年份/地区/类型/导演/主演
}

function minfo(s){
  const p = String(s||'').split('/').map(x=>x.trim()).filter(Boolean);
  return p.slice(1,4).join(' · ');
}

function mcard(it){
  const wrap = document.createElement('div'); wrap.className='item';
  const sc = (typeof it.score==='number' && it.score>0) ? it.score : null;
  if(it.day===today.getDate() && it.month===today.getMonth()+1) wrap.classList.add('today');
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt='', whenCls='';
  if(diff===0){ whenTxt='今天上映'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天上映'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有 '+diff+' 天'; whenCls='soon'; }
  else { whenTxt='已上映'; whenCls='out'; }
  const whenTag = whenCls ? '<span class="when '+whenCls+'">'+whenTxt+'</span>' : '';
  const img = it.poster
    ? '<img class="cover" src="'+esc(it.poster)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  /* 豆瓣 10 分制: ≥8 绿 / ≥6 黄 / <6 红, 整块跳豆瓣条目页 */
  const mc = sc!=null ? '<a class="mcbox '+(sc>=8?'g':(sc>=6?'y':'r'))+'" href="'+esc(it.url||'https://movie.douban.com/')+
      '" target="_blank" rel="noopener" title="豆瓣评分 '+sc+'">'+
      '<span class="mcv">'+sc.toFixed(1)+'</span></a>' : '';
  const mi = minfoParts(it.info);
  const line2 = '<span>'+it.month+'月'+it.day+'日'+(mi.region?' · '+esc(mi.region):'')+'</span>';
  const line3 = mi.kind;   // 第三行只留类型(导演去掉)
  wrap.innerHTML =
    '<div class="pic m">'+img+
      '<div class="ph" style="background:'+phColor(it.title)+(it.poster?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div>'+whenTag+'</div>'+
      '<div class="tag">'+line2+'</div>'+
      (line3?'<div class="tag tag3"><span>'+esc(line3)+'</span></div>':'')+
    '</div>'+mc;
  wrap.querySelector('.t').textContent = it.title;
  return wrap;
}

function renderMovies(d){
  $('#mmeta').textContent = '数据更新于 ' + (d.updated||'');
  const groups = d.groups||[];
  tabbed($('#mtabs'), $('#movieBody'), groups, mcard, '部');
  const total = groups.reduce((s,g)=>s+(g.movies||[]).length,0);
  $('#mfoot').textContent = '共 '+total+' 部 · 评分与信息来自豆瓣';
  showCredit();
  stackFit();
  hideBoot();
}

let moviesLoaded = false;
async function refreshMovies(){
  if(moviesLoaded) return;
  const box = $('#mErrBox');
  box.style.display='none';
  try{
    const r = await fetch('movies.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    renderMovies(d);
    moviesLoaded = true;
  }catch(e){
    box.textContent='获取失败：'+e.message;
    box.style.display='block';
  }
}

/* 顶层切换: 游戏 / 电影 (交叉重叠过渡, 与本月/下月页签同款) */
(function(){
  const top = document.getElementById('topTabs');
  if(!top) return;
  const btns = Array.from(top.querySelectorAll('.tab'));
  let curView = 'game';
  btns.forEach(btn=>btn.addEventListener('click', ()=>{
    const v = btn.dataset.view;
    if(v === curView) return;
    const forward = (v === 'movie');
    const g = document.getElementById('viewGame'), m = document.getElementById('viewMovie');
    const cur = forward ? g : m, nxt = forward ? m : g;
    // 旧视图先脱离文档流, 两视图都走 keyframes 动画(每次强制重播)
    animSwap(cur, nxt, forward);
    curView = v;
    btns.forEach(b=>b.classList.toggle('on', b===btn));
    moveGlider(top, btn);
    if(v === 'movie') refreshMovies();
    /* 直接用新视图高度(此时它还没拿到 on, stackFit 认不出), 高度瞬时调整 */
    const stack = document.getElementById('viewStack');
    if(stack) stack.style.height = nxt.offsetHeight + 'px';
    const fit = (v === 'game') ? window['_fit_tabs'] : window['_fit_mtabs'];
    if(fit) fit();
  }));
  moveGlider(top, top.querySelector('.tab'));
  window.addEventListener('resize', stackFit);
  stackFit();
})();

refresh();
refreshMovies();   // 预渲染电影视图: 首次切换时高度已就位, 避免"先塌后撑"的下沉
</script>
</body>
</html>
